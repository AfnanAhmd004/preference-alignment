[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Reward modelling, DPO and RLHF on a task with a known ground-truth reward"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["align"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
